stages:
  - test
  - publish

variables:
  DOTNET_NOLOGO: "true"
  # Private project holding the Valheim/Unity reference assemblies. Its job
  # token allowlist names this project, which is what lets CI read it without
  # any secret being stored here.
  REFS_PROJECT_ID: "88"
  # Version lives in version.txt; scripts/version.py keeps manifest.json and
  # Main.cs in step with it.

test:build:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends python3 curl
    # The Valheim and Unity reference assemblies are NOT in this repository --
    # they belong to Iron Gate and Unity and are not ours to redistribute. A
    # human gets them from their own game install (scripts/setup-refs.sh); CI
    # pulls the same set from a PRIVATE companion project, reached with
    # CI_JOB_TOKEN via that project's job-token allowlist. No stored secret.
    - curl -sSf --header "JOB-TOKEN:$CI_JOB_TOKEN" -o refs.tar.gz
      "$CI_API_V4_URL/projects/$REFS_PROJECT_ID/packages/generic/refs/1/thorskist-refs.tar.gz"
    - tar xzf refs.tar.gz && rm refs.tar.gz
    - dotnet --version
    - python3 scripts/version.py check
    - dotnet restore ThorsKist.csproj
    - dotnet build ThorsKist.csproj -c Release --no-restore
    # A green build proves nothing about whether the Harmony patches will bind:
    # a renamed game method or an ambiguous overload compiles fine and then does
    # nothing at runtime, logging one line nobody reads. Resolve every target
    # against the vendored game assembly instead.
    # Third argument is the REAL, unpublicized assembly. ThorsKist compiles
    # against a publicized copy where everything is public, so a call to a
    # member the game keeps private compiles clean and throws
    # MethodAccessException the first time that line runs. Without this
    # argument the check silently skips, which is worse than not having it.
    - test -f .refs/assembly_valheim.dll
    - dotnet run --project tools/VerifyPatches/VerifyPatches.csproj -c Release -- bin/Release/net472/ThorsKist.dll lib .refs/assembly_valheim.dll
    # The sort-by-type rules are keyword matching over item names, which fails
    # by quietly filing things in the wrong bucket -- never by throwing. This
    # compiles the mod's REAL rules (KistCategories.cs, no Unity dependency) and
    # runs them against known traps, and re-reads ItemType's numbering out of
    # the game assembly because the classifier hard-codes those numbers.
    - dotnet run --project tools/CategoryCheck/CategoryCheck.csproj -c Release -- .refs
    # Assemble and validate the store payload on every commit, not on release
    # day, so packaging rules (exact 256x256 icon, manifest limits) fail early.
    - VERSION="$(cat version.txt)"
    - rm -rf dist && mkdir -p "dist/ThorsKist-$VERSION/plugins"
    - cp manifest.json README.md CHANGELOG.md icon.png "dist/ThorsKist-$VERSION/"
    # The README's screenshots travel with the payload. Thunderstore renders the
    # README from a URL, not from the zip, so these are for anyone reading the
    # package on disk -- and so the relative links resolve if it is unpacked.
    - cp hird1.png kist1.png "dist/ThorsKist-$VERSION/"
    - cp "bin/Release/net472/ThorsKist.dll" "dist/ThorsKist-$VERSION/plugins/"
    - python3 scripts/package_release.py "dist/ThorsKist-$VERSION" "$VERSION"
    - python3 scripts/verify_hexium.py "dist/ThorsKist-$VERSION.zip" "$VERSION"
  artifacts:
    when: always
    paths:
      - bin/Release/net472/ThorsKist.dll
      - dist/*.zip
    expire_in: 4 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Publishing used to be a human running curl by hand, which is exactly how the
# 0.8.0 payload ended up sitting in the registry with a stale README for two
# commits while every pipeline stayed green. This job publishes the artefacts
# test:build already validated, so what ships is what CI checked.
#
# No stored secret: CI_JOB_TOKEN authenticates both the package registry and
# the Releases API. Manual, because pushing to main should not republish on its
# own -- but one click, from a pipeline that has already passed.
publish:release:
  stage: publish
  image: alpine:3.20
  needs:
    - job: test:build
      artifacts: true
  script:
    - apk add --no-cache curl python3 bash
    - sh scripts/publish_release.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
